[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
name = "kc-knowledge-base-sync"
version = "0.1.0"
description = "Sync KCWorks how-to docs to the MESH knowledge-base repository"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MESH Research", email = "scottia4@msu.edu" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
]
optional-dependencies.dev = ["bump-my-version==1.5.1"]

[project.scripts]
kb-sync = "knowledge_base_sync.cli:main"

[project.urls]
Homepage = "https://github.com/MESH-Research/kc-knowledge-base-sync"
Repository = "https://github.com/MESH-Research/kc-knowledge-base-sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_base_sync = ["templates/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["B", "D", "E", "F", "I", "UP"]
lint.pydocstyle.convention = "google"

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false
allow_shell_hooks = false
message = "Bump version: {current_version} → {new_version}"

# pyproject.toml project.version and tool.bumpversion.current_version are
# updated automatically by bump-my-version's update_config_file; listing them
# here double-applies a whole-file search and fails on the second entry.

[[tool.bumpversion.files]]
filename = "src/knowledge_base_sync/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
